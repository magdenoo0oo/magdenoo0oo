<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink'
     style='isolation: isolate' viewBox='0 0 495 195' width='495px' height='195px' direction='ltr'>
  <style>
    @keyframes currstreak {
      0% { font-size: 3px; opacity: 0.2; }
      80% { font-size: 34px; opacity: 1; }
      100% { font-size: 28px; opacity: 1; }
    }
    @keyframes fadein {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
  <defs>
    <clipPath id='outer_rectangle'>
      <rect width='495' height='195' rx='4.5'/>
    </clipPath>
  </defs>
  <g clip-path='url(#outer_rectangle)'>
    <g style='isolation: isolate'>
      <rect stroke='#000000' stroke-opacity='0' fill='#000000' fill-opacity='0' rx='4.5' x='0.5' y='0.5' width='494' height='194'/>
    </g>
    <g style='isolation: isolate'>
      <line x1='165' y1='28' x2='165' y2='170' vector-effect='non-scaling-stroke' stroke-width='1' stroke='#30363D' stroke-linejoin='miter' stroke-linecap='square' stroke-miterlimit='3'/>
      <line x1='330' y1='28' x2='330' y2='170' vector-effect='non-scaling-stroke' stroke-width='1' stroke='#30363D' stroke-linejoin='miter' stroke-linecap='square' stroke-miterlimit='3'/>
    </g>
    <g style='isolation: isolate'>
      <!-- Total Contributions -->
      <g transform='translate(82.5, 48)'>
        <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#70A5FD' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' style='opacity: 0; animation: fadein 0.5s linear forwards 0.6s'>
          4,280+
        </text>
      </g>
      <g transform='translate(82.5, 84)'>
        <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#70A5FD' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='14px' style='opacity: 0; animation: fadein 0.5s linear forwards 0.7s'>
          Total Contributions
        </text>
      </g>
      <g transform='translate(82.5, 114)'>
        <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#38BDAE' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' style='opacity: 0; animation: fadein 0.5s linear forwards 0.8s'>
          Public &amp; Enterprise
        </text>
      </g>

      <!-- Current Streak -->
      <g transform='translate(247.5, 48)'>
        <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#70A5FD' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' style='animation: currstreak 0.6s linear forwards'>
          52 Days
        </text>
      </g>
      <g transform='translate(247.5, 84)'>
        <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#70A5FD' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='14px' style='opacity: 0; animation: fadein 0.5s linear forwards 0.9s'>
          Current Streak 🔥
        </text>
      </g>
      <g transform='translate(247.5, 114)'>
        <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#38BDAE' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' style='opacity: 0; animation: fadein 0.5s linear forwards 1s'>
          Consistent Delivery
        </text>
      </g>

      <!-- Longest Streak -->
      <g transform='translate(412.5, 48)'>
        <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#70A5FD' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' style='opacity: 0; animation: fadein 0.5s linear forwards 1.1s'>
          186 Days
        </text>
      </g>
      <g transform='translate(412.5, 84)'>
        <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#70A5FD' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='14px' style='opacity: 0; animation: fadein 0.5s linear forwards 1.2s'>
          Longest Streak ⚡
        </text>
      </g>
      <g transform='translate(412.5, 114)'>
        <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#38BDAE' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' style='opacity: 0; animation: fadein 0.5s linear forwards 1.3s'>
          Active Engineering
        </text>
      </g>
    </g>
  </g>
</svg>
